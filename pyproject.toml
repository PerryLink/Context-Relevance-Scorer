[tool.poetry]
name = "context-relevance-scorer"
version = "0.1.0"
description = "RAG 检索结果相关性打分工具"
authors = ["Your Name <email@example.com>"]
readme = "README.md"
packages = [{include = "context_relevance_scorer", from = "src"}]

[tool.poetry.scripts]
context-relevance-scorer = "context_relevance_scorer.cli:app"

[tool.poetry.dependencies]
python = "^3.8"
sentence-transformers = "^2.2.0"
torch = "^2.0.0"
rich = "^13.0.0"
typer = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
